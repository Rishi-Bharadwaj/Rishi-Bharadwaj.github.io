<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head">
    <nav class="wrap nav" aria-label="Main">
      <a class="nav-home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul>
        <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="{{ '/cats/' | relative_url }}"{% if page.url contains '/cats/' %} aria-current="page"{% endif %}>Cats</a></li>
        <li><a href="{{ site.author.cv | relative_url }}">CV</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="wrap site-foot">
    <p>{{ site.author.name }}, {{ site.time | date: "%Y" }}. Last updated {{ site.time | date: "%-d %B %Y" }}.</p>
  </footer>
</body>
</html>
